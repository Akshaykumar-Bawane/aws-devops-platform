apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jungle-fury-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Akshaykumar-Bawane/aws-devops-platform
    targetRevision: HEAD
    path: helm/app
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
