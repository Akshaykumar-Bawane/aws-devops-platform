replicaCount: 2

image:
  repository: 762682890391.dkr.ecr.us-east-1.amazonaws.com/jungle-fury-dev-app
  tag: "376e031b3a80bbf1a072cfa788ecbe82d8dff110"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: false

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  APP_ENV: dev
  APP_NAME: jungle-fury
